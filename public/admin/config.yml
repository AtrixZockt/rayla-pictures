backend:
  name: git-gateway
  branch: main

logo_url: https://rayla-pictures-dev.netlify.app/favicon.svg

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: site
    label: Site
    delete: false
    editor:
      preview: false
    files:
      - file: src/data/site.json
        name: settings
        label: Settings
        format: json
        fields:
          - name: hero_image
            label: Hero image
            widget: image
            hint: "The big photo on the right side of the home page. You can swap this any time."
          - name: changelog
            label: Changelog
            widget: list
            label_singular: Entry
            hint: "Recent updates shown at the bottom of the home page."
            fields:
              - { name: title, label: Title, widget: string, hint: "What was added (e.g. 'European Pictures')" }
              - { name: date, label: Date, widget: string, hint: "Format: DD.MM.YYYY" }

  - name: sets
    label: Sets
    label_singular: Set
    folder: src/content/sets
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    summary: "{{title}} — {{year}}"
    sortable_fields: [title, year, order]
    view_filters:
      - label: Published
        field: draft
        pattern: false
      - label: Drafts
        field: draft
        pattern: true
    fields:
      - name: title
        label: Title
        widget: string
        hint: "Name of the set, e.g. 'European Pictures'"
      - name: year
        label: Year
        widget: number
        value_type: int
        min: 1900
        max: 2100
        hint: "Year the photos were taken"
      - name: cover
        label: Cover
        widget: image
        hint: "Thumbnail shown on the Collection page"
      - name: images
        label: Images
        widget: list
        field: { name: image, label: Image, widget: image }
        hint: "All photos in this set. Drag to reorder. Order here = order on the set page."
      - name: order
        label: Display order
        widget: number
        value_type: int
        default: 0
        required: false
        hint: "Lower number = shown first on the Collection page. Use this to feature a set."
      - name: draft
        label: Hide from site
        widget: boolean
        default: false
        required: false
        hint: "Enable to keep this set hidden — useful while still working on it."