<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rayla Seraphine — Admin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <script src="/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Custom preview that mimics the actual set page on the live site
      var SetPreview = createClass({
        render: function () {
          var entry = this.props.entry;
          var getAsset = this.props.getAsset;

          var title = entry.getIn(['data', 'title']) || 'Untitled';
          var year = entry.getIn(['data', 'year']);
          var cover = entry.getIn(['data', 'cover']);
          var images = entry.getIn(['data', 'images']);
          var imagesArray = images ? images.toJS() : [];

          var coverAsset = cover ? getAsset(cover) : null;

          return h('div', { className: 'set-preview' },
            h('h1', { className: 'set-title' }, title),
            year ? h('div', { className: 'set-year' }, String(year)) : null,
            coverAsset ? h('img', {
              className: 'set-cover',
              src: coverAsset.toString(),
              alt: 'Cover'
            }) : null,
            imagesArray.length > 0
              ? h('div', { className: 'images-stack' },
                  imagesArray.map(function (img, i) {
                    // Handle both flat-string and wrapped-object list shapes
                    var path = typeof img === 'string' ? img : (img && img.image ? img.image : '');
                    var asset = path ? getAsset(path) : null;
                    return h('img', {
                      key: i,
                      className: 'set-image',
                      src: asset ? asset.toString() : '',
                      alt: 'Image ' + (i + 1)
                    });
                  })
                )
              : null
          );
        }
      });

      CMS.registerPreviewTemplate('sets', SetPreview);

      CMS.registerPreviewStyle(`
        body {
          background: #1a1a1a;
          color: #f0f0f0;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
          margin: 0;
          padding: 0;
        }

        .set-preview {
          max-width: 720px;
          margin: 0 auto;
          padding: 48px 24px;
        }

        .set-title {
          font-size: 40px;
          font-weight: 800;
          text-align: center;
          margin: 0 0 8px;
          letter-spacing: -1px;
          line-height: 1.05;
          color: #f0f0f0;
        }

        .set-year {
          text-align: center;
          color: #888;
          font-size: 14px;
          margin-bottom: 40px;
        }

        .set-cover {
          width: 100%;
          aspect-ratio: 4 / 3;
          object-fit: cover;
          margin-bottom: 32px;
          display: block;
          background: #000;
        }

        .images-stack {
          display: flex;
          flex-direction: column;
          gap: 16px;
        }

        .set-image {
          width: 100%;
          height: auto;
          display: block;
          background: #000;
        }
      `, { raw: true });
    </script>
  </body>
</html>
